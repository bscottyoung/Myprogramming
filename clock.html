<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Floating XR Clock</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene xr-mode-ui="enabled: true">

      <!-- CAMERA -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

      <!-- CLOCK GROUP -->
      <a-entity id="clock" position="0 1.5 -1">

        <!-- TIME (EDGE-TO-EDGE) -->
        <a-text
          id="timeText"
          value="12:45"
          color="#FFFFFF"
          align="center"
          width="3.5"
          position="0 0 0"
          shader="msdf"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
        </a-text>

        <!-- BATTERY -->
        <a-text
          id="batteryText"
          value="Battery: 78%"
          color="#FFFFFF"
          align="center"
          width="1.5"
          position="0 -0.4 0"
          shader="msdf"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
        </a-text>

      </a-entity>

      <!-- SCRIPT TO UPDATE TIME -->
      <script>
        function updateClock() {
          const now = new Date();
          const hours = now.getHours().toString().padStart(2, '0');
          const minutes = now.getMinutes().toString().padStart(2, '0');
          document.querySelector('#timeText').setAttribute('value', `${hours}:${minutes}`);
        }
        setInterval(updateClock, 1000);
        updateClock();
      </script>

    <a-scene
  xr-mode-ui="enabled: true"
  webxr="optionalFeatures: hit-test; requiredFeatures: local-floor"
  vr-mode-ui="enabled: false"

  <!-- ADD THIS PINCH-SCALE SCRIPT BELOW -->
  <script>
    AFRAME.registerComponent('pinch-scale', {
      init: function () {
        const el = this.el;
        let initialDistance = null;
        let initialScale = el.object3D.scale.clone();

        this.el.sceneEl.addEventListener('touchmove', (evt) => {
          if (evt.touches.length === 2) {
            const dx = evt.touches[0].pageX - evt.touches[1].pageX;
            const dy = evt.touches[0].pageY - evt.touches[1].pageY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (!initialDistance) {
              initialDistance = distance;
              initialScale = el.object3D.scale.clone();
            }

            const scaleFactor = distance / initialDistance;
            el.object3D.scale.set(
              initialScale.x * scaleFactor,
              initialScale.y * scaleFactor,
              initialScale.z * scaleFactor
            );
          }
        });
      }
    });
  </script>

</a-scene>
